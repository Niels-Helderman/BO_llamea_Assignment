# Benchmark identifiers and dimensionality.
group_id: 9
dimension: 6
problems:
  bbob: {fid: 1, instance: 1}
  realworld: {problem_id: 1124}

# Language model used for code generation.
llm:
  provider: gemini              # gemini | ollama
  model: gemini-3.1-flash-lite  # Availability can change

# LLaMEA population, selection and mutation settings.
llamea:
  n_parents: 2                  # 1..4; initial population size
  n_offspring: 2                # 1..4; number generated per generation
  elitism: true                # Keep best parents
  parent_selection: roulette   # random | roulette | tournament
  tournament_size: 3           # Used only for tournament selection
  operators: novelty           # baseline | novelty
  feedback: rich               # basic | rich
  operator_weights:            # Only used in novelty mode; 0 disables an operator
    refine: 1.0
    surrogate: 1.5
    acquisition: 1.5
    trust_region: 1.0
    hybrid: 1.0
    init: 0.5
    crossover: 1.0             # Requires n_parents >= 2

stage1:
  max_candidates: 100          # Across initial population and all offspring
  budget: 60                   # Actual objective calls per seed, including initialization
  seed_workers: 4              # Independent seed processes, not LLM requests
  timeout_seconds: 240         # Hard wall time per seed, in seconds
  progress_every: 2
  aocc:
    # AOCC transforms best-so-far error into a clipped logarithmic score.
    # Scaled mode uses log10((best - reference) / scale).
    # Unscaled mode uses log10(best - reference).
    lower_log10_error: -8
    upper_log10_error: 2
    bbob_reference: auto       # IOH provides instance-specific optimum
    realworld_reference: auto  # Automatic reference available for problem 1124
    scale: auto                # auto/positive number = scaled; null = unscaled
    calibration_points: 32     # Separate fixed-seed calibration queries
    calibration_seed: 2026

stage2:
  budget: 600                  # CLI --budget overrides the per-run budget
  seed_workers: 4
  timeout_seconds: 1800        # Maximum wall time per seeded run
  botorch_initial_points: 12  # Initial Sobol design size in BoTorch baseline
  ioh_logging: false

prompts:
  bbob: prompts/bbob.txt
  realworld: prompts/realworld.txt
  operator_dir: prompts/operators
